<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>UCC Carpooling - Viajes UCC a Nueva Córdoba</title>
    <meta name="author" content="Josefina Falco" />
    <meta name="description" content="Web para hacer carpooling a la UCC" />
    <meta name="keywords" content="carpooling, ucc, universidad, transporte" />
    <link rel="icon" href="../imagenes/faviconUCC.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="miestilo.css" type="text/css" />
  </head>
  <body onload="mostrarViajesPasajero()">
    <header class="encabezado">
      <h1 class="marca">
        <a href="index.html">
          <img
            src="../imagenes/faviconUCC.png"
            alt="Logo de UCC Carpool"
            class="logo-header"
          />
          <span class="marca-ucc">UCC</span>
          <span class="marca-carpool">Carpool</span>
        </a>
      </h1>

      <div class="acciones-encabezado">
        <a
          href="index.html"
          class="boton boton-fantasma"
          onclick="
            cerrarSesion();
            return false;
          "
          >Salir</a
        >
      </div>
    </header>
    <main class="contenido-principal pagina-con-lateral">
      <p class="migas-de-pan">
        <a href="pasajero.html" class="enlace-migas"
          >&larr; Cambiar dirección</a
        >
      </p>
      <section class="seccion-contenido">
        <h2>Viajes disponibles</h2>
        <p class="etiqueta-ruta">UCC &rarr; Nueva Córdoba</p>
        <p class="texto-secundario" id="cantidad-viajes"></p>
        <p class="texto-secundario" id="total-asientos"></p>
        <ul class="listado-viajes" id="lista-viajes"></ul>
        <p class="mensaje-vacio oculto" id="sin-viajes">
          No hay viajes disponibles en este horario todavía.
        </p>
      </section>
      <aside class="seccion-contenido panel-reservas">
        <h2>Mis reservas</h2>
        <p class="texto-secundario" id="cantidad-reservas"></p>
        <ul class="listado-reservas" id="lista-reservas"></ul>
        <p class="mensaje-vacio oculto" id="sin-reservas">
          Todavía no reservaste ningún viaje.
        </p>
        <p class="total-reservas oculto" id="total-reservas"></p>
      </aside>
    </main>
    <footer class="pie-de-pagina">
      <p>UCC Carpool · Universidad Católica de Córdoba · 2026</p>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
