<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>UCC Carpooling - Detalle del viaje</title>
        <meta name="author" content="Josefina Falco">
        <meta name="description" content="Web para hacer carpooling a la UCC">
        <meta name="keywords" content="carpooling, ucc, universidad, transporte">
        <link rel="icon" href="../imagenes/faviconUCC.png" type="image/png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="miestilo.css" type="text/css">
    </head>
<body onload="cargarDetalleViaje()">

    <header class="encabezado">
        <h1 class="marca"><a href="index.html"><span class="marca-ucc">UCC</span> <span class="marca-carpool">Carpool</span></a></h1>

        <div class="acciones-encabezado">
            <a href="index.html" class="boton boton-fantasma" onclick="cerrarSesion(); return false;">Salir</a>
        </div>
    </header>

    <main class="contenido-principal">

        <p class="migas-de-pan">
            <a href="javascript:history.back()" class="enlace-migas">&larr; Volver</a>
        </p>

        <section class="seccion-contenido">

            <h2 id="titulo-detalle">Detalle del viaje</h2>
            <p class="texto-secundario">Consultá o modificá los datos del viaje</p>

            <div id="vista-pasajero">

                <div class="detalle-fila">
                    <span>Dirección</span>
                    <span id="detalle-direccion"></span>
                </div>

                <div class="detalle-fila">
                    <span>Conductor</span>
                    <span id="detalle-conductor"></span>
                </div>

                <div class="detalle-fila">
                    <span>Hora de salida</span>
                    <span id="detalle-hora"></span>
                </div>

                <div class="detalle-fila">
                    <span>Fecha</span>
                    <span id="detalle-fecha"></span>
                </div>

                <div class="detalle-fila">
                    <span>Asientos disponibles</span>
                    <span id="detalle-asientos"></span>
                </div>

                <div class="detalle-fila">
                    <span>Punto de encuentro</span>
                    <span id="detalle-punto"></span>
                </div>

                <div class="detalle-fila">
                    <span>Precio</span>
                    <span id="detalle-precio"></span>
                </div>

                <button type="button" id="boton-reservar" class="boton boton-primario boton-completo" onclick="reservarViaje()">Reservar viaje</button>

            </div>

            <div id="vista-conductor">

                <form id="formulario-editar-viaje" onsubmit="guardarEdicionViaje(event)">

                    <fieldset class="grupo-formulario">
                        <legend>Ruta y horario</legend>

                        <div class="campo-formulario">
                            <label for="editar-direccion">Dirección</label>
                            <select id="editar-direccion" required>
                                <option value="ucc-nc">UCC &rarr; Nueva Córdoba</option>
                                <option value="nc-ucc">Nueva Córdoba &rarr; UCC</option>
                            </select>
                        </div>

                        <div class="campo-formulario">
                            <label for="editar-hora">Hora de salida</label>
                            <input type="time" id="editar-hora" required>
                        </div>

                        <div class="campo-formulario">
                            <label for="editar-fecha">Fecha</label>
                            <input type="date" id="editar-fecha" required>
                        </div>
                    </fieldset>

                    <fieldset class="grupo-formulario">
                        <legend>Asientos y precio</legend>

                        <div class="campo-formulario">
                            <label for="editar-asientos">Asientos disponibles</label>
                            <input type="number" id="editar-asientos" size="4" min="1" max="4" required>
                        </div>

                        <div class="campo-formulario">
                            <label for="editar-precio">Precio por asiento</label>
                            <input type="number" id="editar-precio" size="8" min="0" required>
                        </div>
                    </fieldset>

                    <fieldset class="grupo-formulario">
                        <legend>Punto de encuentro</legend>

                        <div class="campo-formulario">
                            <label for="editar-punto-encuentro">Punto de encuentro</label>
                            <input type="text" id="editar-punto-encuentro" size="40" maxlength="60" required>
                        </div>
                    </fieldset>

                    <button type="submit" class="boton boton-primario boton-completo">Guardar cambios</button>
                </form>
            </div>

        </section>

    </main>

    <footer class="pie-de-pagina">
        <p>UCC Carpool · Universidad Católica de Córdoba · 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
