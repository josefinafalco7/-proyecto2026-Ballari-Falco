<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>UCC Carpooling</title>
    <meta name="author" content="Josefina Falco" />
    <meta name="description" content="Web para hacer carpooling a la UCC" />
    <meta name="keywords" content="carpooling, ucc, universidad, transporte" />
    <link rel="icon" href="../imagenes/faviconUCC.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="miestilo.css" type="text/css" />
  </head>
  <body>
    <header class="encabezado">
      <h1 class="marca">
        <a href="index.html">
          <img
            src="../imagenes/faviconUCC.png"
            alt="Logo de UCC Carpool"
            class="logo-header"
          />
          <span class="marca-ucc">UCC</span>
          <span class="marca-carpool">Carpool</span>
        </a>
      </h1>
    </header>

    <main class="contenido-principal">
      <section class="seccion-contenido">
        <div class="selector-cuenta">
          <button
            type="button"
            id="boton-mostrar-registro"
            class="activo"
            onclick="mostrarVista('registro')"
          >
            Registrarme
          </button>
          <button
            type="button"
            id="boton-mostrar-login"
            onclick="mostrarVista('login')"
          >
            Ya tengo cuenta
          </button>
        </div>

        <div id="vista-registro">
          <h2>Crear cuenta</h2>
          <p class="texto-secundario">Registrate para reservar viajes</p>

          <form id="formulario-registro" onsubmit="registrarUsuario(event)">
            <fieldset class="grupo-formulario">
              <legend>Datos personales</legend>

              <div class="campo-formulario">
                <label for="registro-nombre">Nombre</label>
                <input
                  type="text"
                  id="registro-nombre"
                  name="registro-nombre"
                  placeholder="Ej: Juan"
                  size="30"
                  maxlength="40"
                  required
                />
              </div>

              <div class="campo-formulario">
                <label for="registro-apellido">Apellido</label>
                <input
                  type="text"
                  id="registro-apellido"
                  name="registro-apellido"
                  placeholder="Ej: Pérez"
                  size="30"
                  maxlength="40"
                  required
                />
              </div>
            </fieldset>

            <fieldset class="grupo-formulario">
              <legend>Tipo de cuenta</legend>

              <div class="opcion-radio">
                <input
                  type="radio"
                  id="tipo-pasajero"
                  name="tipo-cuenta"
                  value="pasajero"
                  checked
                />
                <label for="tipo-pasajero">Solo Pasajero</label>
              </div>

              <div class="opcion-radio">
                <input
                  type="radio"
                  id="tipo-conductor"
                  name="tipo-cuenta"
                  value="conductor"
                />
                <label for="tipo-conductor">Solo Conductor</label>
              </div>

              <div class="opcion-radio">
                <input
                  type="radio"
                  id="tipo-ambos"
                  name="tipo-cuenta"
                  value="ambos"
                />
                <label for="tipo-ambos">Ambos (pasajero y conductor)</label>
              </div>
            </fieldset>

            <fieldset class="grupo-formulario">
              <legend>Acceso</legend>

              <div class="campo-formulario">
                <label for="registro-email">Email universitario</label>
                <input
                  type="email"
                  id="registro-email"
                  name="registro-email"
                  placeholder="2611111@ucc.edu.ar"
                  size="30"
                  maxlength="50"
                  required
                />
              </div>

              <div class="campo-formulario">
                <label for="registro-password">Contraseña</label>
                <input
                  type="password"
                  id="registro-password"
                  name="registro-password"
                  placeholder="••••••••"
                  size="20"
                  maxlength="20"
                  required
                />
              </div>
            </fieldset>

            <button type="submit" class="boton boton-primario boton-completo">
              Crear cuenta
            </button>
          </form>
        </div>

        <div id="vista-login" class="oculto">
          <h2>Iniciar sesión</h2>
          <p class="texto-secundario">Ingresá con tu cuenta existente</p>

          <form id="formulario-login" onsubmit="iniciarSesion(event)">
            <fieldset class="grupo-formulario">
              <legend>Acceso</legend>

              <div class="campo-formulario">
                <label for="login-email">Email universitario</label>
                <input
                  type="email"
                  id="login-email"
                  name="login-email"
                  placeholder="2611111@ucc.edu.ar"
                  size="30"
                  maxlength="50"
                  required
                />
              </div>

              <div class="campo-formulario">
                <label for="login-password">Contraseña</label>
                <input
                  type="password"
                  id="login-password"
                  name="login-password"
                  placeholder="••••••••"
                  size="20"
                  maxlength="20"
                  required
                />
              </div>
            </fieldset>

            <button type="submit" class="boton boton-primario boton-completo">
              Ingresar
            </button>
          </form>
        </div>
      </section>
    </main>

    <footer class="pie-de-pagina">
      <p>UCC Carpool · Universidad Católica de Córdoba · 2026</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
